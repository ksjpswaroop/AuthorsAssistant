[package]
name = "aegisdraft"
version = "0.1.0"
description = "Local-first AI co-author for long-form books"
authors = ["AegisDraft"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "aegisdraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
git2 = "0.21.0"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
ureq = { version = "3.2.1", default-features = false, features = ["json"] }
# Content addressing for the provenance hash chain.
sha2 = "0.10"

# macOS only: security-scoped bookmarks. A sandboxed build loses access to a
# folder the moment it quits, so a recent project needs a token, not a path.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std", "NSURL", "NSString", "NSData", "NSError", "NSArray",
] }

[features]
default = []
